# Runs a short startup benchmark on each runsc platform (including kvm, which
# needs /dev/kvm on the runner) and on runc, without uploading results. See
# the benchmark-platforms target in the Makefile.
name: Benchmarks smoke test

"on":
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmarks-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Each runtime install deletes RUNTIME_LOG_DIR. Keep the runsc debug logs
      # of all platforms in a different directory.
      RUNTIME_LOGS: /tmp/runsc-logs/runsc.log.%TEST%.%TIMESTAMP%.%COMMAND%
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Check for /dev/kvm
      # Fail before the build if the runner has no /dev/kvm, which the kvm
      # platform needs.
      run: |
        if ! test -c /dev/kvm; then
          echo "::error::/dev/kvm is missing, so the kvm platform cannot run."
          exit 1
        fi

    - name: Run benchmarks smoke test
      # Lower than the job limit, so that a hang fails this step and the
      # failure steps below still run.
      timeout-minutes: 50
      run: make benchmark-platforms BENCHMARKS_TARGETS=test/benchmarks/base:startup_test BENCHMARKS_FILTER=BenchmarkStartupEmpty BENCHMARKS_OPTIONS=-test.benchtime=1ns

    - name: Show kernel and Docker logs
      if: failure()
      run: |
        sudo dmesg -T | tail -n 200
        sudo journalctl -u docker --no-pager | tail -n 200

    - name: Upload runsc debug logs
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: runsc-logs
        path: /tmp/runsc-logs/
        retention-days: 7
